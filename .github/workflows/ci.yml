name: correctness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  debug-and-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            clang-format \
            cmake \
            libgtest-dev \
            lld \
            llvm \
            ninja-build \
            qemu-user-static
      - name: Check formatting
        run: |
          find include src tests -type f \
            \( -name '*.c' -o -name '*.h' -o \
               -name '*.cpp' -o -name '*.hpp' \) \
            -print0 |
            xargs -0 clang-format --dry-run --Werror
      - name: Build and test Debug
        run: |
          cmake --preset debug
          cmake --build --preset debug --parallel 2
          ctest --preset debug
      - name: Build and test UBSan
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtest-dev \
            lld \
            llvm \
            ninja-build \
            qemu-user-static
      - name: Build and test ASan plus UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: |
          cmake --preset asan
          cmake --build --preset asan --parallel 2
          ctest --preset asan

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install fuzzing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtest-dev \
            ninja-build
      - name: Build and run bounded libFuzzer gate
        run: |
          cmake --preset fuzz-asan
          cmake --build --preset fuzz-asan --parallel 2
          ctest --preset fuzz-asan -L fuzz
